<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snow Day update</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* same tokens as Settings */
  :root {
    --bg: #f3f4f6; --surface: #ffffff; --hover: #f6f7f9; --line: #e2e5e9; --well: #eceef1;
    --ink: #1b1f24; --mute: #59616c; --accent: #1f72b8; --accent-hover: #1a64a3; --on-accent: #ffffff;
    --r-md: 6px; --r-lg: 8px; --ease: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1f24; --surface: #262a31; --hover: #2c3139; --line: #343a43; --well: #20242a;
      --ink: #eceff3; --mute: #a9b1bc; --accent: #4aa3df; --accent-hover: #63b1e6; --on-accent: #0b1a26;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 14px/20px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  .wrap { display: flex; flex-direction: column; height: 100%; padding: 20px 24px 16px; gap: 14px; }
  .head { display: flex; gap: 14px; align-items: center; }
  .head img { width: 40px; height: 40px; border-radius: var(--r-lg); }
  h1 { margin: 0; font: 600 20px/28px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .sub { color: var(--mute); font-size: 13px; }
  .notes { flex: 1; min-height: 0; overflow: auto; background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 0 0 1px var(--line); padding: 12px 16px; user-select: text; }
  .notes h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--mute); }
  .notes ul { margin: 0; padding-left: 18px; }
  .notes li { margin: 4px 0; }
  .notes .none { color: var(--mute); }
  .foot { display: flex; gap: 8px; align-items: center; }
  .foot .gap { flex: 1; }
  .btn { border: 0; height: 32px; padding: 0 14px; border-radius: var(--r-md); cursor: pointer; font: inherit; font-size: 14px; color: inherit;
    transition: background .12s var(--ease), transform .12s var(--ease); }
  .btn:active { transform: scale(0.97); }
  .btn.text { background: transparent; color: var(--mute); }
  .btn.text:hover { background: var(--hover); color: var(--ink); }
  .btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; min-width: 112px; }
  .btn.primary:hover { background: var(--accent-hover); }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="icon.png" alt="">
    <div><h1 id="title">A new Snow Day is ready</h1><div class="sub" id="sub"></div></div>
  </div>
  <div class="notes" id="notes"><h2>What's new</h2></div>
  <div class="foot">
    <button class="btn text" id="skip">Skip this version</button>
    <span class="gap"></span>
    <button class="btn text" id="later">Remind me later</button>
    <button class="btn primary" id="now">Update now</button>
  </div>
</div>
<script>
'use strict';
const U = window.__UPD || { current: '1.0.0', version: '1.0.1', notes: '- Example change' };
const post = (m) => { try { window.chrome.webview.postMessage(m); } catch (e) { console.log('[post]', m); } };
const $ = (id) => document.getElementById(id);
$('title').textContent = `Snow Day ${U.version} is ready`;
$('sub').textContent = `You have ${U.current}.`;
// the release notes are a plain list ("- one change per line")
const lines = String(U.notes || '').split(/\r?\n/).map((l) => l.trim()).filter((l) => l && !/^critical update/i.test(l));
const notes = $('notes');
if (lines.length) {
  const ul = document.createElement('ul');
  for (const l of lines) { const li = document.createElement('li'); li.textContent = l.replace(/^[-*•]\s*/, ''); ul.appendChild(li); }
  notes.appendChild(ul);
} else {
  const p = document.createElement('div'); p.className = 'none'; p.textContent = 'Fixes and improvements.'; notes.appendChild(p);
}
if (U.skipped) $('skip').style.visibility = 'hidden';
$('now').addEventListener('click', () => post('update:now'));
$('later').addEventListener('click', () => post('update:later'));
$('skip').addEventListener('click', () => post('update:skip'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post('update:later'); if (e.key === 'Enter') post('update:now'); });
$('now').focus();
</script>
</body>
</html>
