name: build

# Every push to main is scanned and built. When the version in main.go has no release yet,
# a release is published with SnowDay.exe and its SHA-256, which installed copies pick up.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash tools/secret-scan.sh

  build:
    needs: scan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Read version from main.go
        run: |
          VER=$(sed -n 's/^var appVersion = "\(.*\)"$/\1/p' main.go)
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build SnowDay.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOFLAGS: -mod=mod
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.appVersion=${{ steps.ver.outputs.version }} -X main.buildID=${GITHUB_SHA::12} -X main.updateRepo=$GITHUB_REPOSITORY" \
            -o SnowDay.exe .
          sha256sum SnowDay.exe > SnowDay.exe.sha256
          cat SnowDay.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SnowDay
          path: |
            SnowDay.exe
            SnowDay.exe.sha256

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SnowDay
      - name: Publish release (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
          VER: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$VER is already released; nothing to do."
            exit 0
          fi
          gh release create "$VER" SnowDay.exe SnowDay.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Snow Day $VER" \
            --notes "Download **SnowDay.exe** and run it. Already installed? It updates itself within a few hours."
