name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash tools/secret-scan.sh

  build:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build SnowDay.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOFLAGS: -mod=mod
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-dev"; fi
          go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.appVersion=$VER -X main.buildID=${GITHUB_SHA::12} -X main.updateRepo=$GITHUB_REPOSITORY" \
            -o SnowDay.exe .
          sha256sum SnowDay.exe > SnowDay.exe.sha256
          cat SnowDay.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SnowDay
          path: |
            SnowDay.exe
            SnowDay.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SnowDay
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SnowDay.exe SnowDay.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Snow Day $GITHUB_REF_NAME" \
            --notes "Download **SnowDay.exe** and run it. Already installed? It updates itself within a few hours."
